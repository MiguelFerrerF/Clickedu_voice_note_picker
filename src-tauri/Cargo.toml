[package]
name = "gestor-de-notas"
version = "2.0.0"
description = "Gestor de Notas — dictado de notas por voz para Clickedu"
authors = ["Miguel Ferrer"]
edition = "2021"
rust-version = "1.88"

# El sufijo `_lib` hace falta para que el nombre de la biblioteca no choque con
# el del binario en Windows. Ver https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "gestor_de_notas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.36"
tauri-plugin-dialog = "2.7.3"
notify-debouncer-mini = "0.7.0"
rust_xlsxwriter = "0.99.1"

# Cada dependencia llega con el hito que la usa, con su motivo, como en
# library-app:
# `calamine` lee las plantillas de Clickedu (H1), `.xlsx` y `.xls`; es la misma
# que usa library-app.
# `tauri-plugin-dialog` es el selector de carpeta de Ajustes (H1).
# `notify-debouncer-mini` vigila la carpeta de plantillas (H1): si se añade un
# Excel, aparece sin pulsar nada. Con *debounce* porque Excel y el Explorador
# tocan un fichero varias veces al guardarlo o copiarlo.
# `rust_xlsxwriter` escribe el Excel exportado (H2); antes solo la usaban los
# tests para escribir sus plantillas.
# Llegarán `reqwest`/`scraper`/`keyring` en H4.

[dev-dependencies]
# Los tests escriben sus plantillas inventadas al vuelo con `rust_xlsxwriter`:
# así no hay ningún Excel binario en el repo y cada test dice qué hay en la
# suya.
tempfile = "3.27.0"
