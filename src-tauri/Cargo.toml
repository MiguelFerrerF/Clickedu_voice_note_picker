[package]
name = "gestor-de-notas"
version = "2.0.1"
description = "Gestor de Notas — dictado de notas por voz para Clickedu"
authors = ["Miguel Ferrer"]
edition = "2021"
rust-version = "1.88"

# El sufijo `_lib` hace falta para que el nombre de la biblioteca no choque con
# el del binario en Windows. Ver https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "gestor_de_notas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.38"
tauri-plugin-dialog = "2.7.3"
notify-debouncer-mini = "0.7.0"
rust_xlsxwriter = "0.103.0"
whisper-rs = "0.16"
cpal = "0.18"
reqwest = { version = "0.12", features = ["cookies", "multipart"] }
sha2 = "0.10"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "system-proxy"] }
scraper = "0.29.0"
keyring = { version = "3", features = ["windows-native"] }

# Cada dependencia llega con el hito que la usa, con su motivo, como en
# library-app:
# `calamine` lee las plantillas de Clickedu (H1), `.xlsx` y `.xls`; es la misma
# que usa library-app.
# `tauri-plugin-dialog` es el selector de carpeta de Ajustes (H1).
# `notify-debouncer-mini` vigila la carpeta de plantillas (H1): si se añade un
# Excel, aparece sin pulsar nada. Con *debounce* porque Excel y el Explorador
# tocan un fichero varias veces al guardarlo o copiarlo.
# `rust_xlsxwriter` escribe el Excel exportado (H2); antes solo la usaban los
# tests para escribir sus plantillas.
# `whisper-rs` es el motor de voz (H3a, D2): whisper.cpp en local. Cómo se
# compila, en `.cargo/config.toml`.
# `cpal` abre el micrófono (H3a). El remuestreo a 16 kHz es propio
# (`voz::remuestreo`): una grabación corta, mono y de una vez no pide más.
# `reqwest` descarga el modelo de Whisper la primera vez que se usa la voz
# (H3a), y `sha2` lo comprueba. La 0.12 de `reqwest`, la de library-app: su
# TLS por defecto en Windows es el del sistema (schannel) y no pide nada más
# para compilar. Con ella hablará con Clickedu (H4). `sha2`, la que ya trae
# Tauri.
# `tauri-plugin-updater` es el actualizador (H7, D7): el oficial, que
# comprueba la firma de cada versión antes de instalarla. Con el TLS del
# sistema, como `reqwest`, y sin `zip`, que en Windows no hace falta.
# Con Clickedu (H4), `reqwest` lleva `cookies` (la sesión) y `multipart`
# (el archivo de seguridad se sube como un formulario). `scraper` lee su
# HTML, que no tiene API para esto. `keyring` guarda la contraseña en el
# Administrador de credenciales de Windows (D3), nunca en un fichero: la 3,
# que es la que habla con él directamente (la 4 lo reparte en varios crates).

[target.'cfg(windows)'.dependencies]
# `windows-registry` encuentra la v1.3.4 para traer sus datos y desinstalarla
# (H7, `migracion`). La misma que ya trae `reqwest`.
windows-registry = "0.6.1"

[dev-dependencies]
# La prueba de voz de H3a (`examples/grabar_frases` y `probar_voz`): `hound`
# escribe y lee los `.wav`, `crossterm` lee el teclado en la consola y
# `dirs` encuentra Documentos (la misma versión que ya trae Tauri).
crossterm = "0.29"
dirs = "7"
hound = "3.5"
# Los tests escriben sus plantillas inventadas al vuelo con `rust_xlsxwriter`:
# así no hay ningún Excel binario en el repo y cada test dice qué hay en la
# suya.
tempfile = "3.27.0"
# El Clickedu falso de los tests de `clickedu` (H4): un servidor HTTP en un
# hilo, con páginas inventadas de la forma que tienen las de verdad.
tiny_http = "0.12.0"
